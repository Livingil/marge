stages:
  - test
  - build
  - deploy

variables:
  FRONTEND_IMAGE_REPOSITORY: "livingil/marge-frontend"
  REMOTE_DIR: "/home/vladimir/marge"
  SSH_PORT: "50022"
  DOCKER_TLS_CERTDIR: "/certs"

frontend:test:
  stage: test
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci
    - npm run build -w frontend

frontend:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - frontend:test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USER" --password-stdin
  script:
    - export FRONTEND_IMAGE="${DOCKER_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - export FRONTEND_IMAGE_LATEST="${DOCKER_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:latest"
    - docker build --pull -f frontend/Dockerfile --build-arg VITE_API_URL="$VITE_API_URL" --build-arg VITE_APP_VERSION="$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE" -t "$FRONTEND_IMAGE_LATEST" frontend
    - docker push "$FRONTEND_IMAGE"
    - docker push "$FRONTEND_IMAGE_LATEST"

deploy:frontend:
  stage: deploy
  image: alpine:3.20
  needs:
    - frontend:image
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - export SSH_TARGET="${SSH_USER}@${SSH_HOST}"
    - export FRONTEND_IMAGE="${DOCKER_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - |
      ssh -p "$SSH_PORT" "$SSH_TARGET" "
        set -eu
        cd '$REMOTE_DIR'

        if [ ! -f .env ]; then
          echo 'Remote .env not found in $REMOTE_DIR'
          exit 1
        fi

        OLD_FRONTEND_IMAGE=\$(grep '^FRONTEND_IMAGE=' .env | cut -d= -f2- || true)
        if [ -z \"\$OLD_FRONTEND_IMAGE\" ]; then
          echo 'FRONTEND_IMAGE is missing in remote .env'
          exit 1
        fi

        cp .env .env.gitlab-ci.bak
        sed -i \"s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE|\" .env

        docker compose -f docker-compose.prod.yml pull frontend
        docker compose -f docker-compose.prod.yml up -d --no-deps frontend

        APP_PORT=\$(grep '^APP_PORT=' .env | cut -d= -f2- || true)
        APP_PORT=\${APP_PORT:-18080}

        for i in \$(seq 1 20); do
          if wget -q -O /dev/null \"http://127.0.0.1:\$APP_PORT/\"; then
            if [ -n \"\${PUBLIC_APP_URL:-}\" ]; then
              wget -q -O /dev/null \"\$PUBLIC_APP_URL\"
            fi
            docker compose -f docker-compose.prod.yml ps frontend
            exit 0
          fi
          sleep 3
        done

        echo 'New frontend failed health check, rolling back to previous image.'
        sed -i \"s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=\$OLD_FRONTEND_IMAGE|\" .env
        docker compose -f docker-compose.prod.yml pull frontend
        docker compose -f docker-compose.prod.yml up -d --no-deps frontend
        exit 1
      "
